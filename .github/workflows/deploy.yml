name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  migrate:
    name: Prisma Migrate
    runs-on: ubuntu-latest

    steps:
      # O webhook de migração estava sendo chamado em TODO push — até numa
      # mudança só de CSS — e, quando o recurso migrate-app ficava indisponível,
      # bloqueava também o deploy da aplicação. A migração só é necessária se o
      # schema ou uma migration mudou entre os dois commits do push.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Prisma changes
        id: prisma
        shell: bash
        run: |
          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- prisma/schema.prisma prisma/migrations; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No Prisma changes; migration is not required."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Prisma changed; migration will run before the app deploy."
          fi

      - name: Trigger Coolify Migration
        if: steps.prisma.outputs.required == 'true'
        run: curl -f -X POST "${{ secrets.COOLIFY_MIGRATION_WEBHOOK }}"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Trigger Coolify App Deploy
        run: curl -f -X POST "${{ secrets.COOLIFY_APP_WEBHOOK }}"
