name: contazoom-services-prod
networks:
  traefik:
    external: true
  internal:
    driver: bridge

volumes:
  contazoom_postgres_data:
  contazoom_redis_data:
  # Arquivo enviado pelo sistema (documentos do cliente e anexos de tarefa) vai
  # para disco, em `UPLOAD_DIR`. Sem este volume o diretório vive dentro do
  # container e TODO arquivo desaparece no próximo deploy — a linha no banco
  # continua lá, apontando para um arquivo que não existe mais.
  contazoom_uploads:

services:
  migrate:
    image: contazoom:${TAG_MIGRATION:-1.0.0-alpine-prod}
    env_file:
      - .env.prod
    depends_on:
      - postgres
    networks:
      - internal

  app:
    image: contazoom:${TAG:-1.0.0-alpine-prod}
    restart: always
    env_file:
      - .env.prod
    environment:
      # Precisa casar com o ponto de montagem abaixo. O código cai em
      # `process.cwd()/uploads` quando a variável não existe, o que dentro do
      # container é justamente o caminho que não persiste.
      UPLOAD_DIR: /app/uploads
    volumes:
      - contazoom_uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      # - "traefik.http.routers.contazoom.entrypoints=web"
      # - "traefik.http.routers.contazoom.rule=Host(`localhost`)"
      - "traefik.http.routers.contazoom.entrypoints=https"
      - "traefik.http.routers.contazoom.rule=Host(`contazoom.com.br`)"
      - "traefik.http.routers.contazoom.tls.certresolver=letsencrypt"
      - "traefik.http.services.contazoom.loadbalancer.server.port=3000"

  postgres:
    image: postgres:17.6-alpine3.21
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: contazoom
      POSTGRES_USER: contazoom_app
      POSTGRES_SCHEMA: public
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - contazoom_postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7.4-alpine3.21
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - contazoom_redis_data:/data
    networks:
      - internal
